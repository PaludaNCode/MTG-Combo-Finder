name: Cache card text

# Fetch oracle text from Scryfall and commit it, so the sandbox this repository is usually
# edited from gets Scryfall's wording instead of Forge's.
#
# Why this is a workflow and not something you run locally: every Scryfall host is refused
# at CONNECT from that sandbox — api.scryfall.com 403s, and so does WebFetch — which is
# the whole reason tools/lookup-card.js has a Forge fallback and why anything Forge
# answers is banner-marked as Forge's wording rather than Wizards'. A runner has no such
# restriction, so this is where reading a card actually happens.
#
# What it buys: research-log.js will not accept a pass without verbatim oracle text for
# every card in it, and that rule is right — it exists because two cards were reasoned
# about from memory and one of those readings survived review. The constraint on the
# research queue was never finding candidates, it was that reading each one is expensive.
# This makes it cheap, and permanently: a card read once is a card read.
#
# **Manual. A weekly schedule was added, found to be useless, and removed — do not re-add cron
# without solving the landing problem first.**
#
# The case for scheduling is real and stands: now that the cache holds every card, the question
# is no longer "does this card still say that" but "did the wording move under anything this
# repository cites", and nobody would ever ask that by hand. An errata under a row in
# unofficial.js is a failure nothing else here can see.
#
# What killed it is where a scheduled run can commit. A schedule executes on the default branch,
# `main` refuses direct pushes, so `tools/cache-target-branch.js` sends the commit to
# card-text/run-<n> and prints a PR link — **and nothing opens that PR.** The errata alarm would
# have fired every Monday while the cache it alarmed about never moved, and a slightly stale
# cache answers every lookup perfectly well, so that would have gone unnoticed for weeks.
#
# Neither obvious fix is free, and both were reached for before being checked:
#
#   - **GitHub Actions cannot be a ruleset bypass actor.** The bypass list offers Deploy keys,
#     Repository admin, Maintain, Write and the installed Apps — there is no entry for
#     `github-actions[bot]`, so "just let the workflow push to main" is not available.
#   - **A pull request opened with GITHUB_TOKEN does not trigger workflows.** So an auto-opened
#     weekly PR never runs `checks`, and since `checks` is required the PR is unmergeable rather
#     than auto-merging.
#
# So an unattended sweep needs a stored credential — a write deploy key, or a PAT to open the PR
# as a real user. That is a deliberate decision about a long-lived secret, not a cron line, and
# it was not worth making while guessing. Dispatch it by hand from a branch; that path is proven.

on:
  workflow_dispatch:
    inputs:
      cards:
        # Semicolons, not commas: "Camellia, the Seedmiser" is one card.
        description: 'Card names, separated by a semicolon (ignored when "sweep" is ticked)'
        required: false
        default: 'Bartolomé del Presidio; Woe Strider; Bloodflow Connoisseur'
      # The sweep is the path that scales and the name list is the exception now. Off by
      # default all the same: a dispatch for one card should stay a dispatch for one card,
      # and this asks Scryfall for its whole bulk file.
      sweep:
        description: 'Sweep EVERY card from Scryfall bulk data instead of the names above'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    # Read by the `impact` job below, which must not run when there is nothing to compare.
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      committed: ${{ steps.commit.outputs.committed }}
    # 30, not 15. The name path never came close, but a sweep downloads Scryfall's bulk
    # file, reads every object in it and writes a much larger card-text.json, and a timeout
    # mid-write is the one failure that could commit a half-swept cache.
    timeout-minutes: 30
    steps:
      # Never onto main: this repo's rule is branch -> PR -> checks -> merge, and a
      # workflow with a write token is not an excuse to skip it. Same rule as
      # resolve-templates.yml, for the same reason.
      #
      # This used to REFUSE when run from the default branch, and the refusal was right
      # about the rule and wrong about what to do with it. Dispatching from main is the
      # obvious mistake to make — it is the branch the Actions UI offers first and the one
      # an API dispatch defaults to — and the only sign was a red X with the reason inside a
      # log nobody opens for a workflow they expect to be slow. Two hours went on believing
      # this workflow was broken when it had refused exactly as designed.
      #
      # So it branches instead of refusing. main is still never pushed to; the commit lands
      # on a branch named after the run, and the summary says where and offers the PR.
      - uses: actions/checkout@v7
      # Before the decision step, not after: that step runs node now.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The decision is tools/cache-target-branch.js, not four lines of shell here, and the
      # reason is that shell in a `run:` block is the one kind of code in this repository
      # nothing can test: exercising it means dispatching the workflow, and exercising the
      # branch that only fires on the default branch means merging this file to the default
      # branch first — a round trip per attempt. test/cache-target-branch.test.js covers both
      # paths in milliseconds and `checks` runs it on every PR.
      - name: Decide where the commit goes
        id: target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="$(node tools/cache-target-branch.js)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$branch" != "$GITHUB_REF_NAME" ]; then
            {
              echo "Dispatched from \`$GITHUB_REF_NAME\`, which refuses direct pushes, so this"
              echo "run commits to \`$branch\` instead."
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # No `if` here, deliberately. The tool reads SWEEP and decides, because shell inside a
      # workflow is the one kind of code in this repository nothing can test, and a wrong
      # branch here is a 40-minute doomed run or a silently ignored name list.
      # test/cache-card-text.test.js covers both modes in milliseconds.
      - name: Fetch the card text
        env:
          CARDS: ${{ inputs.cards }}
          SWEEP: ${{ inputs.sweep }}
        run: |
          set -o pipefail
          node tools/cache-card-text.js | tee -a "$GITHUB_STEP_SUMMARY"

      # The diff is the deliverable, so it goes in the summary too. A card's oracle text
      # arriving as something a person reads is the entire argument for keeping this file
      # in the repository rather than on the data branch.
      #
      # --intent-to-add first, because `git diff` ignores untracked files completely and
      # the first run of this workflow is the one where the file is new. Without it this
      # printed an empty diff for the run that had everything to show.
      - name: Show what changed
        run: |
          git add --intent-to-add card-text.json
          {
            echo ''
            echo '## The diff'
            echo ''
            echo '```diff'
            git --no-pager diff --stat -- card-text.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the result
        id: commit
        run: |
          set -euo pipefail
          # `git status --porcelain`, not `git diff`. This is the line that made the first
          # real run of this workflow report success having done nothing: `git diff` does
          # not see untracked files at all, card-text.json is new on the first run, so git
          # said "no changes" for the one run that had five cards to commit and the job
          # went green. `status --porcelain` sees new and modified alike, which is the
          # question actually being asked.
          if [ -z "$(git status --porcelain -- card-text.json)" ]; then
            echo 'Nothing changed — every card asked for was already cached with the same text.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add card-text.json
          # Asked for rather than composed here, same reason as the step above: a sweep's
          # subject cannot be its card list and that choice is a decision.
          git commit -m "$(node tools/cache-card-text.js --subject)"
          git push origin "HEAD:${BRANCH}"
          echo 'committed=true' >> "$GITHUB_OUTPUT"
          # Where it went and how to land it. A commit on a branch nobody is told about is
          # the same as no commit, which is the other half of the failure this step's
          # sibling above fixes.
          {
            echo ''
            echo "Committed to \`${BRANCH}\` — open the PR:"
            echo ''
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BRANCH}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CARDS: ${{ inputs.cards }}
          SWEEP: ${{ inputs.sweep }}
          BRANCH: ${{ steps.target.outputs.branch }}

  # Did any of that move the ground under something this repository has already reasoned from?
  #
  # A sweep of every card reports every wording that moved, and at 34,422 cards that is a
  # firehose: almost all of it belongs to cards nothing here has ever cited. The subset worth a
  # person is the cards `unofficial.js` and `research-log.js` name, because that is the failure
  # nothing else catches — a row citing "sacrifice a Food" against a card that stopped saying
  # it. The row keeps matching, `checks` stays green, and the reasoning underneath is wrong.
  #
  # Separate job, and the split is about blast radius rather than tidiness — the same reason
  # update-data.yml keeps `graduated` apart from `fetch`. The job above has `contents: write`
  # and pushes a 14MB data file; this one can open an issue and cannot touch the cache.
  impact:
    needs: cache
    # Nothing to compare when nothing was committed, and `false` is the ordinary result of a
    # re-sweep against a Scryfall that has not moved.
    if: ${{ needs.cache.outputs.committed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # depth 2, because the whole comparison is this commit against the one before it. The
      # branch is whatever the job above pushed to — its own name on a dispatch, or
      # card-text/run-<n> when it was dispatched somewhere that refuses direct pushes.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cache.outputs.branch }}
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Compared against what actually landed, not against a report the sweep wrote about
      # itself. A process auditing its own output is something a reader has to take on trust,
      # and two committed revisions cannot be wrong about what they contain.
      - name: What moved, and which of it is cited
        id: impact
        run: |
          set -euo pipefail
          git show HEAD~1:card-text.json > "$RUNNER_TEMP/before.json"
          node tools/sweep-impact.js "$RUNNER_TEMP/before.json" card-text.json \
            --json "$RUNNER_TEMP/impact.json"
          node tools/sweep-impact.js "$RUNNER_TEMP/before.json" card-text.json \
            > "$RUNNER_TEMP/body.md"
          # jq reads a value the tool decided. The decision is in sweep-impact.js, where
          # test/sweep-impact.test.js can reach it — shell in a run block cannot be tested.
          needed=$(jq -r '.needsAttention' "$RUNNER_TEMP/impact.json")
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          jq -r '"\(.totals.changed) changed, \(.totals.renamed) renamed, \(.totals.added) added, \(.totals.gone) no longer listed."' \
            "$RUNNER_TEMP/impact.json" >> "$GITHUB_STEP_SUMMARY"

      # One issue, matched on the exact title because --search is fuzzy and would happily return
      # an issue that merely mentions the words.
      #
      # **It is never closed by this job, and that is the difference from update-data.yml's
      # graduation issue.** That one tracks a *state* — rows Spellbook currently publishes — so an
      # empty list means the work is done and closing is correct. This one records *events*: a
      # card's wording moved on a particular day and somebody has to read what cited it. A later
      # sweep finding no NEW cited change says nothing about whether that reading happened, so
      # auto-closing would silently mark unfinished work done. The first version of this step did
      # exactly that.
      #
      # So events accumulate as comments rather than rewriting the body, and a person closes it.
      - name: Record any cited change on the standing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Oracle text moved under cards this repo cites
          NEEDED: ${{ steps.impact.outputs.needed }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')

          if [ "$NEEDED" != "true" ]; then
            # Deliberately nothing. An open issue stays open: this job cannot know whether the
            # reading it asked for has been done.
            echo 'No cited card changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
            echo "Commented on issue #${number}." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
