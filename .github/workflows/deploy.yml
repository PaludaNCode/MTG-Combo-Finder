name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stamp asset URLs with the commit SHA so fresh HTML always pulls fresh
      # JS/CSS. Pages' CDN caches by full URL and a deploy purges nothing, so
      # unversioned URLs can serve a stale page — or worse, new HTML with old
      # JS — for up to ~20 minutes. index.html itself stays cacheable; this
      # only guarantees the HTML and its assets always match.
      # No list of filenames and no expected count: the script reads whatever the
      # page references, stamps all of it, and fails if anything local is left
      # bare. The list-and-count version this replaces could only catch a rename
      # — an added script went out unstamped while the count still matched, which
      # is how unofficial.js and graph.js each shipped a stale-JS bug that only
      # production could show. Adding a script to a page is now just adding a
      # script to a page.
      #
      # search-worker.js needs no entry here and never did: it is loaded from
      # app.js rather than from the HTML, and stamps its own imports out of its
      # query string. See ASSET_VERSION in app.js.
      #
      # `--worker sw.js` writes the service worker's precache list from the same walk,
      # so the shell it warms is the stamped URLs the pages actually ask for, and there
      # is no second list to keep in step. It also stamps the worker's own BUILD, which
      # is what makes a deploy with no asset change still a new worker as far as the
      # browser is concerned. The step fails if the markers it rewrites are missing —
      # a worker precaching last week's URLs would be worse than one precaching none.
      - name: Cache-bust asset URLs with the commit SHA
        run: node tools/stamp-assets.js "${GITHUB_SHA}" index.html tiers.html --worker sw.js

      - name: Stamp the build id so the pages say what they are running
        run: |
          for page in index.html tiers.html; do
            sed -i "s|<code id=\"build\">[^<]*</code>|<code id=\"build\">${GITHUB_SHA:0:7}</code>|" "$page"
            grep -q "<code id=\"build\">${GITHUB_SHA:0:7}</code>" "$page"
          done

      # All three on their Node 24 majors. The Node 20 runtime is deprecated and every
      # deploy was reporting these as forced onto 24 — including actions/upload-artifact,
      # which this workflow never names: it comes in under upload-pages-artifact.
      # ci.yml does name it, to keep the Playwright report from a failing run, and is
      # on v5 for the same reason.
      #
      # upload-pages-artifact v4 stopped including hidden files, and this uploads
      # `path: .`, so that is a real behaviour change. Checked: the only tracked dotfile
      # is .gitignore, nothing in either page references a dot-path, and there is no
      # .nojekyll to lose — an Actions-deployed site is served as-is and never sees
      # Jekyll. It also stops publishing .github/ to the live site, which was never
      # anything but noise. If a dotfile ever does need serving, v5 added an
      # `include-hidden-files` input for exactly that.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
