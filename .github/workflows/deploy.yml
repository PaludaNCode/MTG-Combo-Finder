name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stamp asset URLs with the commit SHA so fresh HTML always pulls fresh
      # JS/CSS. Pages' CDN caches by full URL and a deploy purges nothing, so
      # unversioned URLs can serve a stale page — or worse, new HTML with old
      # JS — for up to ~20 minutes. index.html itself stays cacheable; this
      # only guarantees the HTML and its assets always match.
      # No list of filenames and no expected count: the script reads whatever the
      # page references, stamps all of it, and fails if anything local is left
      # bare. The list-and-count version this replaces could only catch a rename
      # — an added script went out unstamped while the count still matched, which
      # is how unofficial.js and graph.js each shipped a stale-JS bug that only
      # production could show. Adding a script to a page is now just adding a
      # script to a page.
      #
      # search-worker.js needs no entry here and never did: it is loaded from
      # app.js rather than from the HTML, and stamps its own imports out of its
      # query string. See ASSET_VERSION in app.js.
      #
      # `--worker sw.js` writes the service worker's precache list from the same walk,
      # so the shell it warms is the stamped URLs the pages actually ask for, and there
      # is no second list to keep in step. It also stamps the worker's own BUILD, which
      # is what makes a deploy with no asset change still a new worker as far as the
      # browser is concerned. The step fails if the markers it rewrites are missing —
      # a worker precaching last week's URLs would be worse than one precaching none.
      - name: Cache-bust asset URLs with the commit SHA
        run: node tools/stamp-assets.js "${GITHUB_SHA}" index.html tiers.html --worker sw.js

      - name: Stamp the build id and deploy time so the pages say what they are running
        run: |
          # Both timestamps computed once, before the loop. A `date` call per page
          # would let index.html and tiers.html disagree by a second, and every
          # guard below would still pass on both — the two pages would simply
          # answer "when did this deploy?" differently, which is the one thing
          # this line exists to be trusted about.
          #
          # Deploy time, not commit time: GITHUB_SHA carries no timestamp, the
          # commit's date is derivable from the SHA that is already on the line,
          # and a re-run publishes an old commit. See index.html for the rest.
          built_iso="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          built_human="$(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          for page in index.html tiers.html; do
            sed -i "s|<code id=\"build\">[^<]*</code>|<code id=\"build\">${GITHUB_SHA:0:7}</code>|" "$page"
            sed -i "s|<span id=\"built\">[^<]*</span>|<span id=\"built\">deployed <time datetime=\"${built_iso}\">${built_human}</time></span>|" "$page"
            # One guard per marker. An unstamped footer looks completely normal,
            # so a substitution that quietly matched nothing would publish
            # "Build local · not deployed" with nothing anywhere to say so.
            # The second pattern matches only the rewritten shape: the source
            # marker holds no tags, so it cannot satisfy this grep.
            grep -q "<code id=\"build\">${GITHUB_SHA:0:7}</code>" "$page"
            grep -q "<span id=\"built\">deployed <time datetime=\"${built_iso}\">${built_human}</time></span>" "$page"
          done

      # All three on their Node 24 majors. The Node 20 runtime is deprecated and every
      # deploy was reporting these as forced onto 24 — including actions/upload-artifact,
      # which this workflow never names: it comes in under upload-pages-artifact.
      # ci.yml does name it, to keep the Playwright report from a failing run, and is
      # on v5 for the same reason.
      #
      # upload-pages-artifact v4 stopped including hidden files, and this uploads
      # `path: .`, so that is a real behaviour change. Checked: the only tracked dotfile
      # is .gitignore, nothing in either page references a dot-path, and there is no
      # .nojekyll to lose — an Actions-deployed site is served as-is and never sees
      # Jekyll. It also stops publishing .github/ to the live site, which was never
      # anything but noise. If a dotfile ever does need serving, v5 added an
      # `include-hidden-files` input for exactly that.
      # Ship only what the site serves.
      #
      # `path: .` below uploads the whole checkout, which meant every deploy
      # published card-text.json (16.5 MB of oracle text that only the research
      # tools read), templates.json, research-log.js, both .md references, and
      # tools/, test/ and e2e/. 17.5 MB of an 18.5 MB artifact, for a site that is
      # 1.06 MB. Nothing fetched any of it — but it was all served under our
      # origin to anyone who asked for it by name.
      #
      # **This is not a speed change and must not be described as one.** Measured
      # on the two deploys before it existed: upload-pages-artifact took 2s and 3s,
      # inside jobs of 238s and 17s. All of that spread is deploy-pages queueing.
      #
      # Last, after both stamping steps, because it deletes tools/ — the directory
      # holding the scripts those steps run. Node has the file in memory by then, so
      # the prune deleting its own script mid-run is fine.
      #
      # The decision lives in the tool, not here: a `run:` block is the one thing in
      # this repository nothing can test, and this one deletes directories. What
      # survives is computed from what the pages reference — never a list, for the
      # same reason stamp-assets.js carries no list — and the tool re-reads the
      # pages afterwards and fails the deploy if it removed something they ask for.
      - name: Ship only what the site serves
        run: node tools/prune-artifact.js index.html tiers.html --apply | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5

      # Did the CDN actually serve it?
      #
      # `deploy-pages` succeeding means the artifact was accepted, not that anybody
      # visiting the site gets it. Those are different claims, and only the second one is
      # what "deployed" means to a reader. Pages' CDN caches by full URL and a deploy
      # purges nothing, which is the whole reason the assets carry `?v=<sha>` — the HTML
      # itself is the one thing that has to come back fresh, and until now nothing checked
      # that it did.
      #
      # So the runner reads its own live page and looks for the SHA it stamped into the
      # footer a few steps above. That is the same check a person does by eye, done by the
      # one machine in this pipeline that can reach the site: `raw.githubusercontent.com`
      # is the only host a sandboxed session can talk to, so this cannot be done from
      # anywhere else, and a green job was standing in for it.
      #
      # Retried rather than checked once, because propagation is not instant and a first
      # miss is normal. Twelve attempts, 10s apart — two minutes, against a deploy step
      # that itself takes about one. A run that never sees the new SHA fails the deploy,
      # which is the point: a deploy nobody is being served is not a deploy.
      - name: Confirm the live page is serving this build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          want="${GITHUB_SHA:0:7}"
          url="${PAGE_URL:-https://paludancode.github.io/MTG-Combo-Finder/}"
          echo "Looking for build ${want} at ${url}"
          for attempt in $(seq 1 12); do
            # Cache-busted per attempt: without it a CDN edge can answer every retry from
            # the same stale entry and the loop measures nothing but its own patience.
            body="$(curl -fsSL --max-time 20 "${url}?deploy-check=${want}-${attempt}" || true)"
            if printf '%s' "$body" | grep -q "<code id=\"build\">${want}</code>"; then
              served="$(printf '%s' "$body" \
                | grep -oE '<code id="build">[^<]*</code>.*<span id="built">[^<]*' \
                | head -1 || true)"
              echo "Serving ${want} after ${attempt} attempt(s)."
              echo "footer: ${served}"
              echo "The live page is serving build \`${want}\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt ${attempt}: not yet"
            sleep 10
          done
          echo "::error::The live page never served build ${want}. deploy-pages reported success, so the artifact was accepted — what failed is the CDN serving it."
          exit 1
