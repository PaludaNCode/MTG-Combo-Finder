name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stamp asset URLs with the commit SHA so fresh HTML always pulls fresh
      # JS/CSS. Pages' CDN caches by full URL and a deploy purges nothing, so
      # unversioned URLs can serve a stale page — or worse, new HTML with old
      # JS — for up to ~20 minutes. index.html itself stays cacheable; this
      # only guarantees the HTML and its assets always match.
      - name: Cache-bust asset URLs with the commit SHA
        run: |
          assets='href="style\.css\|src="parser\.js\|src="result-tiers\.js\|src="combos\.js\|src="app\.js\|src="tiers-page\.js'
          # index.html loads five of them, tiers.html three. Both counts are
          # asserted: a rename should fail the deploy, not quietly publish the
          # old URLs.
          for page in "index.html 5" "tiers.html 3"; do
            set -- $page
            sed -i "s/\($assets\)\"/\1?v=${GITHUB_SHA}\"/g" "$1"
            test "$(grep -c "?v=${GITHUB_SHA}" "$1")" = "$2"
          done

      - name: Stamp the build id so the pages say what they are running
        run: |
          for page in index.html tiers.html; do
            sed -i "s|<code id=\"build\">[^<]*</code>|<code id=\"build\">${GITHUB_SHA:0:7}</code>|" "$page"
            grep -q "<code id=\"build\">${GITHUB_SHA:0:7}</code>" "$page"
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
