name: CI

# Three jobs, and the split is about wall-clock rather than tidiness.
#
# Measured over six recent runs of the single job this replaces (median step times,
# 96s of steps in a 106s job): browser tests 41s, installing Chromium 22s, the layout
# smoke test 20s, lint 5s, and 8s for checkout, setup-node, the syntax pass, the unit
# tests and the README numbers together. So 83 of 96 step-seconds were three browser
# steps running one after another, and two of the three need nothing from each other:
# `verify` drives the runner's pre-installed google-chrome, `test:ui` drives
# Playwright's own Chromium. Running them side by side makes the job the longer of the
# two rather than their sum.
#
# `checks` at the bottom is the one name the `main` ruleset requires, and it exists so
# that this restructuring did not have to touch the ruleset. Splitting a required check
# into two new names is the kind of change that reads as fine and silently stops gating
# anything, because a required check that no longer reports is a required check nobody
# notices the absence of.

on:
  # No `push: branches: [main]`, and that is a deliberate removal rather than an
  # oversight. It was 39% of this repository's Actions minutes — 51.9 of 133.7 runner
  # minutes over two days — re-testing a tree that had already been tested:
  # `actions/checkout` on a pull_request event checks out the MERGE of the head into
  # the base, and in 36 of the last 39 merges the merge commit's tree was
  # byte-identical to the branch tip, meaning `main` never moved while the pull
  # request was open. The other 3 were real merges where it did.
  #
  # It could not protect the deploy either, which is the part worth being clear about:
  # deploy.yml triggers on the same push with no `needs` and no `workflow_run`, so both
  # started together and a bad merge was live in ~27s whatever this workflow said
  # afterwards. Gating the deploy on it instead was the alternative, and it was
  # rejected: it would have added ~106s to every merge→live, taking it from 27s to
  # over two minutes, to cover a case that happens 3 times in 39.
  #
  # What makes the removal safe is "Require branches to be up to date before merging"
  # on the `main` ruleset. With that on, the tree this workflow tests is provably the
  # tree that lands — 39 in 39 rather than 36 in 39. Without it, those 3-in-39 merges
  # land a tree no run has seen. If that setting is ever turned off, this trigger
  # belongs back.
  pull_request:
  # So a run can be re-triggered by hand when GitHub misses a pull_request event.
  workflow_dispatch:
    inputs:
      # The upload step at the bottom of the browser job sits behind `if: failure()`,
      # so a green run never reaches it and a bump to that action is proved only by the
      # next run that goes red — which is the worst moment to discover the report no
      # longer uploads, because it is the moment somebody needs to read it.
      #
      # This makes it provable on demand instead of retroactively. Default off: a
      # normal pull request still only uploads on failure, and this adds a way to check
      # rather than a new behaviour.
      prove_upload:
        description: 'Upload the Playwright report even if everything passed (proves the upload step still works)'
        type: boolean
        default: false

# One pin, used by both the install command and the cache key below. It was two
# before — the version in the install command and the version in package.json's
# `test:ui` — and a cache key made that worse, because a key naming the wrong version
# restores the wrong browser build. They are still two files, so
# test/workflow-pins.test.js asserts they agree in milliseconds rather than leaving it
# to a confusing "Executable doesn't exist" in CI.
env:
  PLAYWRIGHT_VERSION: 1.56.1

jobs:
  # Everything that needs no browser download. Ends with the layout smoke test, which
  # uses the google-chrome already on the runner image — that is why this job can start
  # measuring the page while the other one is still fetching Chromium.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22, not 20: the coverage floors below need --test-coverage-lines,
          # which landed in 22.8, and every other workflow here is already on 22.
          node-version: 22
      - name: Syntax-check all JS
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done

      # What --check cannot see: a misspelled global, a variable a refactor left
      # behind, a duplicate object key. Fetched for this step rather than
      # installed — see the note at the top of eslint.config.mjs.
      - name: Lint
        run: npm run lint

      # Coverage floors, set a point under what the suite currently manages, so
      # they catch a module arriving untested rather than bickering over a line.
      # Only files the tests load are measured, which is the logic: app.js and
      # tiers-page.js are covered by the layout test below instead. theme.js is
      # excluded explicitly for the same reason — the tests require it for the three
      # pure functions at the top, and the browser half below them cannot run in
      # node, so measuring it would score DOM wiring the layout test already presses.
      - name: Unit tests, with coverage floors
        run: npm run test:coverage

      # The README states real counts — tier entries, unofficial rows, templates —
      # and they move when the files they describe do. This checks the ones this
      # repository can count; anything measured against the published database is
      # somebody else's data on a particular morning and stays prose.
      - name: The README's countable numbers
        run: npm run check:readme

      # Renders the real page at phone/tablet/desktop widths and fails on
      # horizontal overflow, a collapse control that doesn't collapse, or the
      # desktop columns not splitting.
      - name: Layout smoke test
        run: npm run verify
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # The same pages, driven rather than measured: a real pointer, real key presses, a
  # real touchscreen, a reload, a shared link opened in a second tab. See "Two browser
  # test suites" in the README for which check belongs in which of the two.
  #
  # e2e/a11y.spec.js runs in here too, on the same browsers, because it needs exactly
  # what this job already pays for: a real engine computing real colours over a page
  # that has actually been searched. It fetches axe-core alongside Playwright —
  # pinned, like everything else fetched per run.
  #
  # Only Chromium is installed. Three engines would triple the longest step in this
  # workflow, and nothing here is engine-specific — the page is plain DOM and
  # hand-written SVG. A Firefox or WebKit bug would be found by someone using the
  # site, which is the honest trade and worth writing down rather than implying
  # otherwise by not naming the browser.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Chromium is ~150MB fetched fresh every run, inside a step that measured 22s.
      # How much of that 22s is the download and how much is the apt half of
      # `--with-deps` was never measured — the job log redirects to a blob host that a
      # sandboxed session cannot reach — so treat the saving here as "somewhere
      # between nothing and 22s" until a cache-hit run says otherwise. The key names
      # the version because a cache keyed on anything looser serves the browser build
      # a different Playwright expects, which fails as "Executable doesn't exist" and
      # reads as a broken cache rather than a stale one.
      #
      # v4 is the major this was written against. It was not checked against the
      # action's latest major, because that means reading a repository outside this
      # session's scope — if a Node-20-runtime deprecation warning shows up on this
      # step, that is what it is and it wants the next major.
      - name: Cache the Playwright browser download
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      # Two steps rather than one `--with-deps`, because the cache only holds the
      # browser: the system libraries it links against live in the runner image and
      # have to be asked for again on a cache hit. `install-deps` is the apt half on
      # its own.
      - name: Install Chromium for the browser tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} install --with-deps chromium

      - name: Install Chromium's system libraries (the browser itself was cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} install-deps chromium

      - name: Browser tests
        run: npm run test:ui

      # The report is worth having exactly when the step above went red.
      #
      # v7, and this is the action where the "everything is on Node 24" claim was
      # not true: v5 still declared `using: node20` — the deprecated runtime the
      # whole sweep existed to leave. v7 is `node24`, so this bump is the one that
      # actually delivers what the others were merged for.
      #
      # The immutable-artifact change that broke uploading twice under one name was
      # v3 → v4; this step uploads once, from a job that has already failed. v7 adds
      # an `archive` input, which nothing here passes.
      #
      # It used to be the least verified line in this file, for a reason worth keeping
      # written down: `if: failure()` means a green run never reaches it, so a bump
      # here was proved by the first run that went red — the worst moment to find out
      # the report no longer uploads, since it is the moment somebody needs it.
      #
      # `prove_upload` is the way to ask on purpose. Run this workflow by hand with it
      # ticked and the step runs on a green build, which is the only way to see the
      # upload work without breaking something first. The condition keeps `failure()`
      # first so the ordinary path is unchanged and obvious.
      #
      # No `always()` wrapper, deliberately: an `if` that already names a status check
      # function does not get the implicit `success()` gate, so `failure() ||` is
      # enough and `always() &&` would only be noise that reads as necessary. On a
      # pull_request there is no `inputs` context, which evaluates falsey — so the
      # ordinary path really is unchanged.
      - name: Keep the report from a failing run
        if: ${{ failure() || inputs.prove_upload }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The gate, and the only check name the `main` ruleset knows about. Two jobs became
  # three so that this name could stay exactly what it was.
  #
  # `if: always()` is load-bearing and the trap is worth naming: without it this job is
  # SKIPPED when a dependency fails, and GitHub reports a skipped required check as a
  # neutral conclusion rather than a failure — which is the well-known path to a merge
  # gate that waves everything through. So it always runs, and the decision about
  # whether it passed lives in the `if:` expression rather than in shell, because shell
  # inside a `run:` block is the one thing in this repository nothing can test.
  #
  # 'skipped' is deliberately not in the list. Neither job above carries an `if:`, so
  # neither can skip; if one ever does, that is a deliberate act and should not fail
  # the gate.
  checks:
    runs-on: ubuntu-latest
    if: always()
    needs: [static, browser]
    steps:
      - name: Fail if any job above did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
