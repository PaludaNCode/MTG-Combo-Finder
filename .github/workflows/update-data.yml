name: Update combo data

on:
  schedule:
    - cron: '17 4 * * *' # daily; GitHub's scheduler is best-effort
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Publish even if the snapshot is much smaller than the published one'
        type: boolean
        default: false
      # Everything up to and including the gate, and then stop. The point is to be
      # able to run this against the real export from a branch: the fetcher's output
      # is only ever as good as a shape somebody else controls, and the alternative
      # to checking on demand is finding out at 04:17 on a job that force-pushes.
      dry_run:
        description: 'Fetch and check, but publish nothing'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tools/fetch-combos.js'
      - '.github/workflows/update-data.yml'

concurrency:
  group: combo-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Scoped to the job rather than the file, now that there are two of them. The
    # second job must not inherit this: see the note on its own permissions block.
    permissions:
      contents: write
    steps:
      # Pinned to commit SHAs rather than to `@v5`, and only in this workflow.
      #
      # A tag is a moving pointer the action's owner can repoint at will, so `@v5`
      # means "whatever that repository decides v5 is on the morning this runs".
      # Everywhere else here that would cost a broken build. Here it would cost the
      # `data` branch: this is the only job in the repository with `contents: write`,
      # and it force-pushes an orphan commit, so whatever runs in it can rewrite
      # published data that has no history to recover from.
      #
      # The comment after each SHA is the tag it was taken from — that is the only
      # thing making a pin readable, and Dependabot rewrites both together
      # (.github/dependabot.yml). Bumping one by hand means bumping the comment too,
      # or the next reader is told something untrue.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22, like every other workflow here. This ran on 20 while ci.yml's own
          # comment claimed everything was already on 22 — and 20 is end-of-life, so
          # the daily refresh was the one job still on an unsupported runtime.
          node-version: '22'

      # Writes combos.json and, beside it, the steps tree: one small file per
      # combo, 256 directories deep, at the paths steps-source.js asks for. Both
      # come out of the same pass over the export, which is the only way the two
      # can be guaranteed to describe the same snapshot.
      - name: Fetch the combo database
        run: node tools/fetch-combos.js "$RUNNER_TEMP/combos.json" "$RUNNER_TEMP/steps"

      # Before the publish, not after. The data branch is one orphan commit that
      # gets force-pushed, so there is no history and nothing to roll back to —
      # the previous snapshot is gone the moment a worse one lands. The fetcher's
      # own guards catch a file that is wrong on its own terms; this catches one
      # that is only wrong beside yesterday's.
      #
      # A real shrink is possible, so there is a way to say so: re-run from the
      # Actions tab with allow_shrink ticked. The override is a person deciding,
      # which is the right shape for a judgement this script cannot make.
      - name: Refuse a snapshot that lost a chunk of the database
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          # pipefail explicitly: Actions runs `bash -e`, which does not set it, so
          # a `| tee` would hand back tee's exit code and this gate would report
          # success for every refusal it printed.
          set -o pipefail
          node tools/check-snapshot.js "$RUNNER_TEMP/combos.json" \
            --steps "$RUNNER_TEMP/steps" | tee -a "$GITHUB_STEP_SUMMARY"

      # Published as a single orphan commit so the data never accumulates
      # history and the repo stays small — same approach as MTG-Pricerunner.
      - name: Publish to the data branch
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/data-branch"
          mkdir -p "$work"
          cp "$RUNNER_TEMP/combos.json" "$work/combos.json"
          # 103,737 files, and the reason they are affordable is measured rather
          # than hoped: `git add` of a tree this size is 24s, the commit 1.6s, and
          # the pack 19.8 MB — inside a job that has just streamed a 512 MB export.
          # See steps-source.js for why the cost sits here and not on the reader.
          cp -r "$RUNNER_TEMP/steps" "$work/steps"
          cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan data
          git add combos.json steps
          git commit -q -m "Combo data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            data
          echo "Published $(du -h combos.json | cut -f1) combos.json and $(du -sh steps | cut -f1) of steps to the data branch"

      - name: Say what a dry run would have published
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run — nothing was published"
            echo ""
            echo "combos.json: $(du -h "$RUNNER_TEMP/combos.json" | cut -f1)"
            echo "steps: $(find "$RUNNER_TEMP/steps" -type f | wc -l) files, $(du -sh "$RUNNER_TEMP/steps" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # After publishing, not before: a broken citation is a problem with our own
      # file rather than with the data, and holding today's combos back over it
      # would be the wrong end of the stick. It still fails the job, because the
      # unofficial panel's whole claim is that each row shows the published combo
      # it came from — an id that has stopped resolving is a citation to nothing.
      #
      # Also reports rows Spellbook has *published* since we wrote them. That is
      # not a failure: it is what a row is for, the page already drops it, and
      # this is how anyone finds out it can come out of the file.
      - name: Check the unofficial rows still cite something real
        if: ${{ !inputs.dry_run }}
        run: node tools/verify-unofficial.js "$RUNNER_TEMP/combos.json" >> "$GITHUB_STEP_SUMMARY"

  # The other half of keeping unofficial.js current, and the half that was missing.
  #
  # A broken citation fails the job above and is impossible to miss. A row Spellbook
  # has *since published* exits 0 and prints into the step summary of a nightly cron
  # job that passed — which is the same as not reporting it. The file's whole promise
  # is that its rows graduate rather than accumulate, and a graduate nobody removes is
  # that promise quietly not being kept. CLAUDE.md's rule is that outstanding work is a
  # GitHub issue, so this keeps exactly one and closes it when the list empties.
  #
  # Separate from `fetch` on purpose. That job force-pushes the data branch and is the
  # only thing in the repository with `contents: write`; giving it `issues: write` too
  # would widen the one job whose blast radius the pinned SHAs above exist to bound.
  # This one can open an issue and cannot touch the data.
  graduated:
    needs: fetch
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Read off the branch rather than through the CDN. raw.githubusercontent can
      # still be serving yesterday's file minutes after a force-push, and a stale read
      # would close this issue against data that no longer exists. Sparse, because the
      # branch also carries 103,737 step files this job has no use for.
      - name: Take the snapshot that was just published
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: snapshot
          fetch-depth: 1
          sparse-checkout: combos.json
          sparse-checkout-cone-mode: false

      # `|| true` deliberately. A broken citation exits 1, and the job above has
      # already failed loudly over it — losing a night of graduation reporting to an
      # unrelated failure would be the wrong trade. The tool writes the JSON before it
      # returns on that path, so the list is still there to read.
      - name: List the rows Spellbook now publishes
        run: |
          node tools/verify-unofficial.js snapshot/combos.json \
            --graduated "$RUNNER_TEMP/graduated.json" > /dev/null || true

      - name: Keep the standing issue in step with it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Unofficial rows Spellbook now publishes
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/graduated.json"
          count=$(jq '.graduated | length' "$file")
          snapshot=$(jq -r '.snapshot // "unknown"' "$file")
          checked=$(jq -r '.checked' "$file")
          # Matched on the exact title rather than by --search, which is fuzzy and would
          # happily return a different issue that merely mentions the words. Exactness
          # is what makes this idempotent: one standing issue, edited, never duplicated.
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')

          if [ "$count" -eq 0 ]; then
            if [ -n "$number" ]; then
              printf '%s\n' \
                "All of these are out of \`unofficial.js\` now." \
                "" \
                "Snapshot \`$snapshot\`: $checked rows checked, none graduated." \
                "Closing — the nightly job opens a fresh one if that changes." \
                > "$RUNNER_TEMP/done.md"
              gh issue comment "$number" --body-file "$RUNNER_TEMP/done.md"
              gh issue close "$number"
            fi
            echo "No graduated rows against $snapshot." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The body is rewritten every night rather than appended to, which is why it
          # is allowed to carry a list at all. CLAUDE.md says an issue names where the
          # live answer lives instead of restating it, because a hand-copied count rots
          # the moment somebody acts on it — a machine-regenerated one cannot, and the
          # note below tells the next reader which of the two this is.
          {
            echo "These rows in \`unofficial.js\` name a card set Commander Spellbook has"
            echo "since published. **That is what a row is for.** Nothing is broken and no"
            echo "reader sees a duplicate — \`matchUnofficial()\` already drops a graduated"
            echo "row at run time. They can simply come out of the file."
            echo ""
            echo "**This body is rewritten by the nightly data job. Do not edit it by hand.**"
            echo "The live answer is \`npm run verify:unofficial\`, which prints the same list"
            echo "against today's snapshot."
            echo ""
            echo "Finish condition: \`npm run verify:unofficial\` reports no graduated rows."
            echo "This job closes the issue itself when that happens."
            echo ""
            echo "---"
            echo ""
            echo "Snapshot \`$snapshot\` — $count of $checked rows:"
            echo ""
            jq -r '.graduated[] | "- " + .' "$file"
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated issue #$number — $count graduated row(s)." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
