name: Look up card text

# Manual, and deliberately tiny: given card names, print their oracle text from
# Scryfall into the run summary. It exists so that "what does this card actually
# say?" is answered by reading the card rather than by inferring it from the
# shape of the combo data.
on:
  workflow_dispatch:
    inputs:
      cards:
        # Semicolons, not commas: "Camellia, the Seedmiser" is one card.
        description: 'Card names, separated by a semicolon'
        required: true
        default: 'Carrion Feeder; Viscera Seer; Umbral Collar Zealot'

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read the cards
        env:
          CARDS: ${{ inputs.cards }}
        run: node tools/lookup-card.js
